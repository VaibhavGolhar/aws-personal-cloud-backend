spring.application.name=Personal-Cloud-Test

# Use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT configuration for testing
app.jwt.secret=test-secret-key-must-be-long-enough-for-hs256-which-is-at-least-256-bits-length
app.jwt.expiration-ms=86400000

# AWS mock configuration
app.aws.region=us-east-1
app.s3.bucket=test-bucket

# Actuator mock configuration
FRONTEND_URL=http://localhost:3000
